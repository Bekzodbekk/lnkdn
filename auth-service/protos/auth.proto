syntax = "proto3";

option go_package = "genproto/authpb";

service UserService{
    rpc SignIn(SignInReq) returns (SignInResp); 
    rpc ForgetPasswordSendCodeEmail(ForgetPasswordSendCodeEmailReq) returns (ForgetPasswordSendCodeEmailResp);
    rpc ForgetPasswordCheckCode(ForgetPasswordCheckCodeReq) returns (ForgetPasswordCheckCodeResp);
    rpc ForgetPasswordUpdatePassword(ForgetPasswordUpdatePasswordReq) returns (ForgetPasswordUpdatePasswordResp);
    rpc UpdatePassword(UpdatePasswordReq) returns (UpdateUserResp);
    rpc CheckCodeAfterUpdatePassword(CheckCodeAfterUpdatePasswordReq) returns (CheckCodeAfterUpdatePasswordResp);

    rpc CreateUser(CreateUserReq) returns (CreateUserResp);
    rpc UpdateUser(UpdateUserReq) returns (UpdateUserResp);
    rpc DeleteUser(DeleteUserReq) returns (DeleteUserResp);
    rpc GetUserById(GetUserByIdReq) returns (GetUserByIdResp);
    rpc GetUsers(GetUsersReq) returns (GetUsersResp);
}


message User{
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string phone = 4;
    string email = 5;
    string username = 6;
    string password = 7;
}

message CheckCodeAfterUpdatePasswordReq{
    string id = 1;
    string password = 2;
}
message CheckCodeAfterUpdatePasswordResp{
    bool status = 1;
    string message = 2;
}

message UpdatePasswordReq{
    string id = 1;
    string newPassword = 2;
}
message UpdatePasswordResp{
    bool status = 1;
    string message = 2;
}


message SignInReq{
    string username = 1;
    string password = 2;
}
message SignInResp{
    bool status = 1;
    string message = 2;
    string token = 3;
}

message ForgetPasswordSendCodeEmailReq{
    string email = 1;
}
message ForgetPasswordSendCodeEmailResp{
    bool status = 1;
    string message = 2;
}

message ForgetPasswordCheckCodeReq{
    string email = 1;
    string code = 2;
}
message ForgetPasswordCheckCodeResp{
    bool status = 1;
    string message = 2;
}

message ForgetPasswordUpdatePasswordReq{
    string email = 1;
    string newPassword = 2;
}
message ForgetPasswordUpdatePasswordResp{
    bool status = 1;
    string message = 2;
}

message CreateUserReq{
    string first_name = 1;
    string last_name = 2;
    string phone = 3;
    string email = 4;
    string username = 5;
    string password = 6;
}
message CreateUserResp{
    bool status = 1;
    string message = 2;
}


message UpdateUserReq{
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string phone = 4;
    string email = 5;
    string username = 6;
}
message UpdateUserResp{
    bool status = 1;
    string message = 2;
}

message DeleteUserReq{
    string id = 1;
}
message DeleteUserResp{
    bool status = 1;
    string message = 2;
}

message GetUserByIdReq{
    string id = 1;
}
message GetUserByIdResp{
    bool status = 1;
    string message = 2;
    User user = 3;
}

message GetUsersReq{}
message GetUsersResp{
    bool status = 1;
    string message = 2;
    repeated User users = 3;
}



