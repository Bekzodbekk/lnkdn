syntax = "proto3";

option go_package = "genproto/likepb";

service LikeService{
    rpc ToggleLike(ToggleLikeReq) returns (ToggleLikeResp);
}

message Like{
    string id = 1;
    string user_id = 2;
    string post_id = 3;
}

message ToggleLikeReq{
    string user_id = 1;
    string post_id = 2;
}
message ToggleLikeResp{
    bool status = 1;
    string message = 2;
}